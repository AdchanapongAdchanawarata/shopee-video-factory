<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Shopee 1-Click Video Maker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0c0c0e; color: #f4f4f5; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #27272a; padding-bottom: 12px; margin-bottom: 12px; }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .logo { width: 28px; height: 28px; background: #ee4d2d; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 14px; }
    .title { font-size: 13px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 10px; color: #a1a1aa; }
    .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3); }

    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .card-label { font-size: 10px; color: #a1a1aa; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .product-title { font-size: 12px; font-weight: 600; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #27272a; font-size: 11px; }
    .price { color: #f97316; font-weight: 800; font-size: 14px; }
    .price-input {
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #f97316;
      font-weight: 800;
      font-size: 13px;
      border-radius: 6px;
      padding: 3px 8px;
      text-align: right;
      width: 145px;
      outline: none;
      transition: all 0.2s;
    }
    .price-input:focus {
      border-color: #ee4d2d;
      background: rgba(249, 115, 22, 0.18);
      box-shadow: 0 0 0 2px rgba(238, 77, 45, 0.25);
    }
    .product-title[contenteditable="true"]:focus {
      outline: 1px solid #ee4d2d;
      border-radius: 4px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.05);
    }
    .footage-badge { display: flex; align-items: center; gap: 4px; color: #34d399; font-weight: 600; font-size: 10px; }

    .btn-produce { width: 100%; padding: 12px; border-radius: 12px; background: linear-gradient(135deg, #ee4d2d 0%, #ff6433 100%); color: #fff; font-size: 13px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 16px rgba(238, 77, 45, 0.4); transition: transform 0.15s; }
    .btn-produce:hover { transform: scale(1.02); }
    .btn-produce:disabled { opacity: 0.5; cursor: not-allowed; }

    .env-select { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10px; color: #71717a; }
    select { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; font-size: 10px; border-radius: 6px; padding: 2px 6px; outline: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <div class="logo">▶</div>
      <div>
        <div class="title">Shopee Video Maker</div>
        <div class="subtitle">AI Studio 9:16 (Mali Voice)</div>
      </div>
    </div>
    <span id="page-status" class="status-badge">พร้อมเชื่อมต่อ</span>
  </div>

  <div class="card">
    <div class="card-label">
      <span>สินค้าตรวจพบล่าสุด</span>
      <span id="label-media">ภาพ/วิดีโอแท้</span>
    </div>
    <div id="product-name" class="product-title">กำลังค้นหาข้อมูลสินค้าในหน้านี้...</div>
    <div class="meta-row">
      <span class="card-label">ราคาขาย (แก้ไขได้):</span>
      <input type="text" id="product-price" class="price-input" value="฿--" placeholder="฿0.00" title="แก้ไขราคาได้ตามต้องการ">
    </div>
  </div>

  <button type="button" id="btn-export" class="btn-produce">
    <span>⚡ ส่งไปผลิตวิดีโอ 9:16 ทันที</span>
  </button>

  <div class="env-select">
    <span>เซิร์ฟเวอร์เป้าหมาย:</span>
    <select id="select-env">
      <option value="https://shopee-video-factory.vercel.app">Vercel Cloud (Online)</option>
      <option value="http://localhost:8000">Local Machine (เครื่องนี้)</option>
    </select>
  </div>

  <script src="popup.js"></script>
</body>
</html>
